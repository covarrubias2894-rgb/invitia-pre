/* ---------- Guardado (si está bloqueado, todo sigue igual) ---------- */
function leer(){ try{ return JSON.parse(localStorage.getItem(LS)) || {}; }catch(e){ return {}; } }
function guardar(cambios){ try{ const d = leer(); Object.assign(d, cambios); localStorage.setItem(LS, JSON.stringify(d)); }catch(e){} }
function borrarSesion(){ try{ const d = leer(); delete d.sesion; localStorage.setItem(LS, JSON.stringify(d)); }catch(e){} }

/* ---------- Clave ---------- */
async function hashTexto(txt){
  try{
    if (window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return sha256Simple(txt);
}
// Alternativa para cuando el navegador no trae crypto.subtle (por ejemplo en http)
function sha256Simple(txt){
  const K = [], H = [];
  let n = 2, c = 0;
  const fr = x => (x - Math.floor(x)) * 4294967296 | 0;
  while (c < 64){
    let primo = true;
    for (let d = 2; d * d <= n; d++) if (n % d === 0){ primo = false; break; }
    if (primo){ if (c < 8) H[c] = fr(Math.pow(n, 1/2)); K[c] = fr(Math.pow(n, 1/3)); c++; }
    n++;
  }
  const bytes = unescape(encodeURIComponent(txt)).split('').map(ch => ch.charCodeAt(0));
  const largo = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (largo >>> (i * 8)) & 255);
  const rot = (x, r) => (x >>> r) | (x << (32 - r));
  const W = new Array(64);
  for (let o = 0; o < bytes.length; o += 64){
    for (let i = 0; i < 16; i++) W[i] = (bytes[o+i*4] << 24) | (bytes[o+i*4+1] << 16) | (bytes[o+i*4+2] << 8) | bytes[o+i*4+3];
    for (let i = 16; i < 64; i++){
      const s0 = rot(W[i-15],7) ^ rot(W[i-15],18) ^ (W[i-15] >>> 3);
      const s1 = rot(W[i-2],17) ^ rot(W[i-2],19) ^ (W[i-2] >>> 10);
      W[i] = (W[i-16] + s0 + W[i-7] + s1) | 0;
    }
    let [a,b,cc,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++){
      const t1 = (h + (rot(e,6) ^ rot(e,11) ^ rot(e,25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      const t2 = ((rot(a,2) ^ rot(a,13) ^ rot(a,22)) + ((a & b) ^ (a & cc) ^ (b & cc))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
    }
    [a,b,cc,d,e,f,g,h].forEach((v, i) => H[i] = (H[i] + v) | 0);
  }
  return H.map(v => (v >>> 0).toString(16).padStart(8,'0')).join('');
}

let fallos = 0;
async function intentar(ev){
  ev.preventDefault();
  const inp = document.getElementById('clave'), btn = document.getElementById('entrar'), err = document.getElementById('error');
  const h = await hashTexto(inp.value);
  if (h === CLAVE_HASH){
    if (document.getElementById('recordar').checked) guardar({sesion: CLAVE_HASH});
    inp.value = '';
    entrar(true);
    return;
  }
  fallos++;
  inp.value = '';
  if (fallos >= 3){
    btn.disabled = true; inp.disabled = true;
    err.textContent = "Esa clave no es. Tómate un respiro y vuelve a intentarlo en 3 segundos.";
    setTimeout(() => { fallos = 0; btn.disabled = false; inp.disabled = false; err.textContent = "Ya puedes intentarlo otra vez."; inp.focus(); }, 3000);
  } else {
    err.textContent = "Esa clave no es. Inténtalo otra vez.";
    inp.focus();
  }
}

/* ---------- Fecha y hora en México ---------- */
function partesMexico(fecha){
  try{
    const p = {};
    new Intl.DateTimeFormat('en-US', {timeZone: ZONA, year:'numeric', month:'numeric', day:'numeric', hour:'numeric', minute:'numeric', hourCycle:'h23'})
      .formatToParts(fecha).forEach(x => p[x.type] = +x.value);
    return {y:p.year, m:p.month, d:p.day, h:p.hour % 24, min:p.minute};
  }catch(e){
    const f = new Date(fecha.getTime() - 6 * 3600000); // México centro: UTC-6 todo el año
    return {y:f.getUTCFullYear(), m:f.getUTCMonth()+1, d:f.getUTCDate(), h:f.getUTCHours(), min:f.getUTCMinutes()};
  }
}
function diaDelAnio(p){ return Math.round((Date.UTC(p.y, p.m-1, p.d) - Date.UTC(p.y, 0, 1)) / 86400000) + 1; }
function bloqueDe(h){ return h <= 5 ? 'madrugada' : h <= 11 ? 'manana' : h <= 18 ? 'tarde' : 'noche'; }
function rotar(lista, p){ return lista[(diaDelAnio(p) * 7 + p.h) % lista.length]; }

const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function textoFecha(fecha){
  try{
    const f = new Intl.DateTimeFormat('es-MX', {timeZone: ZONA, weekday:'long', day:'numeric', month:'long', year:'numeric'}).format(fecha);
    const h = new Intl.DateTimeFormat('es-MX', {timeZone: ZONA, hour:'numeric', minute:'2-digit', hour12:true}).format(fecha);
    return f.replace(/,/g, '') + ' · ' + h.replace(/\s+/g, ' ');
  }catch(e){
    const p = partesMexico(fecha), dow = new Date(Date.UTC(p.y, p.m-1, p.d)).getUTCDay();
    const h12 = p.h % 12 || 12;
    return DIAS[dow] + ' ' + p.d + ' de ' + MESES[p.m-1] + ' de ' + p.y + ' · ' + h12 + ':' + String(p.min).padStart(2,'0') + (p.h < 12 ? ' a. m.' : ' p. m.');
  }
}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const conNombre = s => s.replace(/\{nombre\}/g, NOMBRE_USUARIO);
const svg = k => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONOS[k] + '</svg>';
let avisoT;
function aviso(t){ const a = $('#aviso'); a.textContent = t; a.classList.add('on'); clearTimeout(avisoT); avisoT = setTimeout(() => a.classList.remove('on'), 1800); }

async function copiar(texto){
  try{ if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(texto); return true; } }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = texto; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}

/* ---------- Frases ---------- */
const PREFIERE = {manana:['confianza','valor','avance'], noche:['calma'], madrugada:['calma','proceso']};
function frasesDe(bloque){
  const sinCobrar = FRASES.filter(f => bloque === 'tarde' || f.c !== 'cobrar');
  const pref = PREFIERE[bloque] ? sinCobrar.filter(f => PREFIERE[bloque].includes(f.c)) : [];
  return pref.length >= 5 ? pref : sinCobrar;
}
let fraseActual = null;
function pintarFrase(f){
  fraseActual = f;
  const b = $('#frase-t');
  b.textContent = '“' + conNombre(f.t) + '”';
  b.classList.remove('aparece'); void b.offsetWidth; b.classList.add('aparece');
}
function otraFrase(){
  const pool = frasesDe(bloqueDe(partesMexico(new Date()).h));
  let f; do { f = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && f === fraseActual);
  pintarFrase(f);
}

/* ---------- Desbloqueo creativo ---------- */
let filtro = 'todas', ideaActual = null, vistas = [];
const hechasHoy = new Set();
function ideasDe(){ return filtro === 'todas' ? IDEAS : IDEAS.filter(x => x.c === filtro); }
function pintarIdea(x){
  ideaActual = x;
  const i = IDEAS.indexOf(x);
  vistas = vistas.filter(v => v !== i); vistas.push(i); if (vistas.length > 10) vistas.shift();
  guardar({ultimaIdea: i});
  $('#idea-e').textContent = x.e;
  $('#idea-t').textContent = conNombre(x.t);
  $('#idea-c').textContent = CATS[x.c] || x.c;
  $('#idea-h').hidden = !hechasHoy.has(i);
  $('#bien').hidden = true;
  const fav = (leer().favoritas || []).includes(i);
  $('#guardar').textContent = fav ? '⭐ Guardada' : '⭐ Guardar';
  const card = $('#idea'); card.classList.remove('aparece'); void card.offsetWidth; card.classList.add('aparece');
}
function otraIdea(){
  const pool = ideasDe().map(x => IDEAS.indexOf(x));
  const evitar = vistas.slice(-Math.min(10, pool.length - 1));
  let libres = pool.filter(i => !evitar.includes(i) && !hechasHoy.has(i));
  if (!libres.length) libres = pool.filter(i => i !== IDEAS.indexOf(ideaActual));
  if (!libres.length) libres = pool;
  pintarIdea(IDEAS[libres[Math.floor(Math.random() * libres.length)]]);
}
function alternarFavorita(){
  const i = IDEAS.indexOf(ideaActual);
  let favs = leer().favoritas || [];
  if (favs.includes(i)){ favs = favs.filter(f => f !== i); aviso('La quitamos de tus favoritas'); }
  else { favs.push(i); aviso('Guardada en tus favoritas ⭐'); }
  favoritasMem = favs; guardar({favoritas: favs});
  pintarIdea(ideaActual);
  if (!$('#panel').hidden && panelModo === 'favs') verFavoritas();
}
let favoritasMem = null, panelModo = null;
function favs(){ const f = leer().favoritas; return f || favoritasMem || []; }
function verFavoritas(){
  panelModo = 'favs';
  const lista = favs();
  $('#panel-t').textContent = 'Mis favoritas';
  $('#panel-l').innerHTML = lista.length
    ? lista.map(i => IDEAS[i] ? '<div class="item"><span class="e">' + IDEAS[i].e + '</span><span class="t">' + esc(conNombre(IDEAS[i].t)) + '</span><button type="button" data-quitar="' + i + '" aria-label="Quitar de favoritas">✕</button></div>' : '').join('')
    : '<p class="vacio">Aún no guardas ninguna. Toca “⭐ Guardar” en una idea que te guste.</p>';
  $('#panel').hidden = false;
}
function verTodas(){
  panelModo = 'todas';
  const lista = ideasDe();
  $('#panel-t').textContent = (filtro === 'todas' ? 'Todas las ideas' : CATS[filtro]) + ' · ' + lista.length;
  $('#panel-l').innerHTML = lista.map(x => '<div class="item"><span class="e">' + x.e + '</span><span class="t">' + esc(conNombre(x.t)) + '</span></div>').join('');
  $('#panel').hidden = false;
}
function yaLoHice(){
  hechasHoy.add(IDEAS.indexOf(ideaActual));
  const b = $('#bien');
  b.textContent = conNombre('¡Qué bien, {nombre}! A veces eso es todo lo que hace falta.');
  b.hidden = false;
  $('#idea-h').hidden = false;
}

function entrar(conAnimacion){

      '<footer><p>Hecho con cariño por Felipe · NegoBoost MX</p><button class="mini" type="button" id="salir">Cerrar sesión</button></footer>' +
    '</div>';
  c.hidden = false;
  document.title = 'Hola, ' + NOMBRE_USUARIO + ' · Invitia atelier';

  const reloj = () => { $('#reloj').textContent = textoFecha(new Date()); };
  reloj();
  setTimeout(function tic(){ reloj(); setTimeout(tic, 60000 - Date.now() % 60000 + 50); }, 60000 - Date.now() % 60000 + 50);

  pintarFrase(rotar(frasesDe(bloque), p));
  const u = leer().ultimaIdea;
  pintarIdea(IDEAS[u] || IDEAS[(diaDelAnio(p) * 7 + p.h) % IDEAS.length]);

  c.addEventListener('click', async ev => {
    const t = ev.target.closest('button');
    if (!t) return;
    if (t.dataset.link){
      ev.preventDefault(); ev.stopPropagation();
      const ok = await copiar(t.dataset.link);
      if (ok){ t.textContent = 'Copiado ✓'; t.classList.add('ok'); aviso('Link copiado. Ya puedes pegarlo.'); setTimeout(() => { t.textContent = 'LINK'; t.classList.remove('ok'); }, 1500); }
      else aviso('No se pudo copiar. Mantén presionada la tarjeta para copiar el link.');
      return;
    }
    if (t.dataset.f){
      filtro = t.dataset.f;

      return;
    }
    if (t.dataset.quitar !== undefined){
      const i = +t.dataset.quitar, f = favs().filter(x => x !== i);
      favoritasMem = f; guardar({favoritas: f}); verFavoritas();
      if (IDEAS.indexOf(ideaActual) === i) pintarIdea(ideaActual);
      return;
    }
    switch (t.id){
      case 'otra-frase': otraFrase(); break;
      case 'otra-idea': otraIdea(); break;
      case 'guardar': alternarFavorita(); break;
      case 'hecho': yaLoHice(); break;
      case 'ver-favs': verFavoritas(); break;
      case 'ver-todas': verTodas(); break;
      case 'cerrar-panel': $('#panel').hidden = true; break;
      case 'salir': borrarSesion(); location.reload(); break;
    }
  });
}
